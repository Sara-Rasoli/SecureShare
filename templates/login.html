{% extends "base.html" %}

{% block title %}
Login - SecureShare
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Login</h1>

    <form method="POST">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >


        <button type="submit" class="button">
            Login
        </button>

    </form>

    <p>
        Do not have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>

</div>

{% endblock %}
