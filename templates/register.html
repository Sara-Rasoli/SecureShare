{% extends "base.html" %}

{% block title %}
Register - SecureShare
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Create an Account</h1>

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >


        <label for="confirm_password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            required
        >


        <button type="submit" class="button">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>

</div>

{% endblock %}
